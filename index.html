<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanem Sözen | Portfolyo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #ec4899;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            border: 4px solid #475569;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .title {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background-color: #ec4899;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #db2777;
        }
        .btn-secondary {
            background-color: #334155;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Baş Harfler -->
        <div class="avatar">SS</div>
        
        <h1>Sanem Sözen</h1>
        <div class="title">Portfolyo & Projeler</div>
        
        <p>
            Selam! Burası Sanem Sözen'in kişisel web alanı. Yaptığım işler, projeler ve hakkımdaki detaylar burada yer alıyor.
        </p>

        <div class="links">
            <a href="mailto:sanem@example.com" class="btn">İletişime Geç</a>
            <a href="https://instagram.com" target="_blank" class="btn btn-secondary">Instagram / Sosyal Medya</a>
        </div>
    </div>

</body>
</html>
